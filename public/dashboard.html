<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Soporte — Jira</title>
<style>
  :root {
    color-scheme: dark;
    --page:        #0f172a;
    --surface-1:   #1e293b;
    --surface-2:   #16213a;
    --text-primary:   #f1f5f9;
    --text-secondary: #94a3b8;
    --text-muted:     #64748b;
    --border:      rgba(255,255,255,0.08);
    --accent:      #60a5fa;
    --good:        #22c55e;
    --warning:     #f59e0b;
    --critical:    #ef4444;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 56px;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  #whoami { font-size: 13px; color: var(--text-secondary); }
  #whoami .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background: var(--text-muted); }
  #whoami.ok .dot { background: var(--good); }
  #whoami.err .dot { background: var(--critical); }

  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 18px;
  }
  .controls label { font-size: 13px; color: var(--text-secondary); }
  .controls input[type="month"] {
    font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary);
  }
  .controls button {
    font: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 6px;
    border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer;
  }
  .controls button:hover { background: rgba(96,165,250,0.12); }
  .controls .msg { font-size: 13px; color: var(--text-secondary); }
  .controls .msg.err { color: var(--critical); }

  nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  nav.tabs button {
    font: inherit; font-size: 14px; font-weight: 500; padding: 10px 16px;
    background: none; border: none; cursor: pointer; color: var(--text-secondary);
    border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  nav.tabs button.active { color: var(--text-primary); border-bottom-color: var(--accent); }

  .panel { display: none; }
  .panel.active { display: block; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .tile .value { font-size: 26px; font-weight: 600; }
  .tile .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .tile.good .value { color: var(--good); }
  .tile.warn .value { color: var(--warning); }
  .tile.crit .value { color: var(--critical); }

  h2.section-title { font-size: 15px; font-weight: 600; margin: 24px 0 10px; color: var(--text-primary); }
  h2.section-title:first-child { margin-top: 0; }

  table { width: 100%; border-collapse: collapse; background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13px; }
  thead th {
    text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 12px;
    padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2);
    white-space: nowrap;
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.03); }
  td.name { font-variant-numeric: normal; font-weight: 500; }
  td.num { text-align: right; }
  .table-wrap { overflow-x: auto; margin-bottom: 20px; }

  .empty { color: var(--text-muted); font-size: 13px; padding: 16px; text-align: center; }
  .fcr-pct { font-weight: 600; }
  .fcr-pct.good { color: var(--good); }
  .fcr-pct.warn { color: var(--warning); }
  .fcr-pct.crit { color: var(--critical); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Dashboard Soporte — Jira</h1>
    <div id="whoami">Comprobando conexión…</div>
  </header>

  <div class="controls">
    <label for="month">Mes</label>
    <input type="month" id="month" />
    <button id="reload">Actualizar</button>
    <span class="msg" id="msg"></span>
  </div>

  <nav class="tabs">
    <button data-tab="resumen" class="active">Resumen</button>
    <button data-tab="proyecto">Por proyecto</button>
    <button data-tab="tecnico">Por técnico</button>
    <button data-tab="escaladas">Escaladas</button>
    <button data-tab="tipologia">Tipología</button>
    <button data-tab="locales">Locales</button>
  </nav>

  <section class="panel active" id="panel-resumen">
    <div class="tiles" id="tiles-resumen"></div>
    <h2 class="section-title">Por proyecto</h2>
    <div class="table-wrap" id="tabla-resumen-proyecto"></div>
  </section>

  <section class="panel" id="panel-proyecto">
    <div class="table-wrap" id="tabla-proyecto"></div>
  </section>

  <section class="panel" id="panel-tecnico">
    <div class="table-wrap" id="tabla-tecnico"></div>
  </section>

  <section class="panel" id="panel-escaladas">
    <div class="tiles" id="tiles-escaladas"></div>
    <h2 class="section-title">Por partner</h2>
    <div class="table-wrap" id="tabla-partners"></div>
  </section>

  <section class="panel" id="panel-tipologia">
    <div class="tiles" id="tiles-tipologia"></div>
    <h2 class="section-title">Por familia</h2>
    <div class="table-wrap" id="tabla-familias"></div>
    <h2 class="section-title">Por categoría</h2>
    <div class="table-wrap" id="tabla-categorias"></div>
  </section>

  <section class="panel" id="panel-locales">
    <div class="tiles" id="tiles-locales"></div>
    <h2 class="section-title">Por local</h2>
    <div class="table-wrap" id="tabla-locales"></div>
  </section>

</div>

<script>
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  // --- Tabs ---
  $$('nav.tabs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      $$('nav.tabs button').forEach((b) => b.classList.remove('active'));
      $$('.panel').forEach((p) => p.classList.remove('active'));
      btn.classList.add('active');
      $('#panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // --- Month default = current ---
  const monthInput = $('#month');
  const now = new Date();
  monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

  const msgEl = $('#msg');
  function setMsg(text, isErr) {
    msgEl.textContent = text || '';
    msgEl.classList.toggle('err', !!isErr);
  }

  // --- Whoami ---
  async function loadWhoami() {
    const el = $('#whoami');
    try {
      const r = await fetch('/api/jira/me');
      const data = await r.json();
      if (data.ok) {
        el.innerHTML = `<span class="dot"></span>Conectado como ${data.displayName || data.email || 'usuario'}`;
        el.className = 'ok';
      } else {
        el.innerHTML = `<span class="dot"></span>Sin conexión con Jira`;
        el.className = 'err';
      }
    } catch {
      el.innerHTML = `<span class="dot"></span>Sin conexión con el proxy`;
      el.className = 'err';
    }
  }

  // --- Helpers de formato ---
  function fmt(n) { return (n === null || n === undefined) ? '—' : new Intl.NumberFormat('es-ES').format(n); }
  function fmtPct(n) { return (n === null || n === undefined) ? '—' : `${n}%`; }
  function fmtScoring(n) { return (n === null || n === undefined) ? '—' : n.toFixed(2); }
  function pctClass(pct) {
    if (pct === null || pct === undefined) return '';
    if (pct >= 80) return 'good';
    if (pct >= 50) return 'warn';
    return 'crit';
  }

  const BLOQUE_COLS = [
    { key: 'creadas', label: 'Creadas', num: true },
    { key: 'resueltas', label: 'Resueltas', num: true },
    { key: 'abiertas', label: 'Abiertas', num: true },
    { key: 'fcrPct', label: 'FCR %', num: true, pct: true },
    { key: 'escaladas', label: 'Escaladas', num: true },
    { key: 'diasEscalada', label: 'Días esc. (media)', num: true },
    { key: 'scoring', label: 'Scoring', num: true, scoring: true },
  ];

  function tableFromBloqueMap(map, nameLabel, container) {
    const entries = Object.entries(map || {});
    if (!entries.length) {
      container.innerHTML = '<div class="empty">Sin datos para este mes.</div>';
      return;
    }
    let html = '<table><thead><tr>';
    html += `<th>${nameLabel}</th>`;
    for (const c of BLOQUE_COLS) html += `<th>${c.label}</th>`;
    html += '</tr></thead><tbody>';
    for (const [name, b] of entries) {
      html += '<tr>';
      html += `<td class="name">${escapeHtml(name)}</td>`;
      for (const c of BLOQUE_COLS) {
        const v = b[c.key];
        if (c.pct) {
          html += `<td class="num"><span class="fcr-pct ${pctClass(v)}">${fmtPct(v)}</span></td>`;
        } else if (c.scoring) {
          html += `<td class="num">${fmtScoring(v)}</td>`;
        } else {
          html += `<td class="num">${fmt(v)}</td>`;
        }
      }
      html += '</tr>';
    }
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function tableFromPartners(map, container) {
    const entries = Object.entries(map || {});
    if (!entries.length) {
      container.innerHTML = '<div class="empty">Sin escaladas este mes.</div>';
      return;
    }
    let html = '<table><thead><tr><th>Partner</th><th>Nº escaladas</th><th>Días (media)</th></tr></thead><tbody>';
    for (const [name, v] of entries) {
      html += `<tr><td class="name">${escapeHtml(name)}</td><td class="num">${fmt(v.n)}</td><td class="num">${v.dias}</td></tr>`;
    }
    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function tile(label, value, extraClass, sub) {
    return `<div class="tile ${extraClass || ''}"><div class="label">${label}</div><div class="value">${value}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  }

  function renderResumenTiles(total) {
    $('#tiles-resumen').innerHTML =
      tile('Creadas', fmt(total.creadas)) +
      tile('Resueltas', fmt(total.resueltas)) +
      tile('Abiertas', fmt(total.abiertas)) +
      tile('FCR', fmt(total.fcr), '', `${fmtPct(total.fcrPct)} de resueltas`) +
      tile('Escaladas', fmt(total.escaladas)) +
      tile('Días esc. (media)', total.diasEscalada) +
      tile('Scoring medio', fmtScoring(total.scoring), '', total.nScore ? `${total.nScore} valoradas` : 'sin valoraciones');
  }

  function renderEscaladasTiles(total) {
    $('#tiles-escaladas').innerHTML =
      tile('Escaladas', fmt(total.escaladas)) +
      tile('Días esc. (media)', total.diasEscalada) +
      tile('% sobre creadas', total.creadas ? `${round1((total.escaladas / total.creadas) * 100)}%` : '—');
  }
  function round1(x) { return Math.round(x * 10) / 10; }

  function renderTipologiaTiles(data) {
    $('#tiles-tipologia').innerHTML =
      tile('Categorizadas', fmt(data.nCategorizadas)) +
      tile('Sobre total', data.n ? `${round1((data.nCategorizadas / data.n) * 100)}%` : '—');
  }

  function renderLocalesTiles(data) {
    $('#tiles-locales').innerHTML =
      tile('Con local asociado', fmt(data.nConLocal)) +
      tile('Sobre total', data.n ? `${round1((data.nConLocal / data.n) * 100)}%` : '—');
  }

  async function loadDashboard() {
    const month = monthInput.value;
    if (!month) return;
    setMsg('Cargando datos de ' + month + '…', false);
    try {
      const r = await fetch(`/api/jira/dashboard?month=${encodeURIComponent(month)}`);
      const data = await r.json();
      if (!data.ok) {
        setMsg(data.error || 'Error al cargar datos.', true);
        return;
      }
      setMsg(`${fmt(data.n)} incidencias creadas en ${data.month}.`, false);

      renderResumenTiles(data.total);
      tableFromBloqueMap(data.proyectos, 'Proyecto', $('#tabla-resumen-proyecto'));
      tableFromBloqueMap(data.proyectos, 'Proyecto', $('#tabla-proyecto'));
      tableFromBloqueMap(data.tecnicos, 'Técnico', $('#tabla-tecnico'));

      renderEscaladasTiles(data.total);
      tableFromPartners(data.partners, $('#tabla-partners'));

      renderTipologiaTiles(data);
      tableFromBloqueMap(data.familias, 'Familia', $('#tabla-familias'));
      tableFromBloqueMap(data.categorias, 'Categoría', $('#tabla-categorias'));

      renderLocalesTiles(data);
      tableFromBloqueMap(data.locales, 'Local', $('#tabla-locales'));
    } catch (err) {
      setMsg('Error de conexión con el proxy: ' + err.message, true);
    }
  }

  $('#reload').addEventListener('click', loadDashboard);
  monthInput.addEventListener('change', loadDashboard);

  loadWhoami();
  loadDashboard();
</script>
</body>
</html>
